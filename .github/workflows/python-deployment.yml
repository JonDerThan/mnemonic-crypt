# Create Python distribution files and standalone binaries for Linux and
# Windows. Publishes the distribution files to PyPI. Creates a new release for
# the created tag and attaches the distribution files and binaries. If a release
# for that tag already exists, the files are attached to the existing one.

name: Python Deployment

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  dist-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build utility
        run: python -m pip install build

      - name: Build release distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  binary-build-linux:
    # We don't use the latest version here because that links agains a shared
    # libary that isn't available on most systems.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --editable ".[deployment]"
      - name: Create binaries
        env:
          ZIP_FILE_NAME: "mnemonic_crypt_linux_${{ github.ref_name }}.zip"
        run: |
          pyinstaller --distpath bin mnemonic_crypt.spec
          pyinstaller --distpath bin mnemonic_crypt_gui.spec
          cd bin
          zip $ZIP_FILE_NAME *

      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: bin/*.zip

  binary-build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --editable ".[deployment]"
      - name: Create binaries
        env:
          ZIP_FILE_NAME: "mnemonic_crypt_windows_${{ github.ref_name }}.zip"
        run: |
          pyinstaller --distpath bin mnemonic_crypt.spec
          pyinstaller --distpath bin mnemonic_crypt_gui.spec
          cd bin
          7z a $env:ZIP_FILE_NAME *

      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: bin/*.zip

  pypi-publish:
    runs-on: ubuntu-latest
    needs: dist-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/mnemonic-crypt

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-gh-release:
    runs-on: ubuntu-latest
    needs:
      - dist-build
      - binary-build-linux
      - binary-build-windows
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux
          path: bin/
      - uses: actions/download-artifact@v4
        with:
          name: bin-windows
          path: bin/
      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            bin/*
